name: Publish release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Validate version and signing secrets
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.DORMKIT_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.DORMKIT_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.DORMKIT_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.DORMKIT_KEY_PASSWORD }}
        run: |
          VERSION_NAME="$(grep '^VERSION_NAME=' version.properties | cut -d= -f2 | tr -d '\r')"
          if [[ "${GITHUB_REF_NAME}" != "v${VERSION_NAME}" ]]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match VERSION_NAME=${VERSION_NAME}"
            exit 1
          fi
          if [[ -z "${KEYSTORE_BASE64}" || -z "${KEYSTORE_PASSWORD}" || -z "${KEY_ALIAS}" || -z "${KEY_PASSWORD}" ]]; then
            echo "::error::Configure all four DORMKIT signing secrets before publishing. See RELEASE.md."
            exit 1
          fi

      - name: Decode release keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.DORMKIT_KEYSTORE_BASE64 }}
        run: echo "${KEYSTORE_BASE64}" | base64 --decode > "${RUNNER_TEMP}/dormkit-release.jks"

      - name: Build signed release APK
        env:
          DORMKIT_KEYSTORE_PATH: ${{ runner.temp }}/dormkit-release.jks
          DORMKIT_KEYSTORE_PASSWORD: ${{ secrets.DORMKIT_KEYSTORE_PASSWORD }}
          DORMKIT_KEY_ALIAS: ${{ secrets.DORMKIT_KEY_ALIAS }}
          DORMKIT_KEY_PASSWORD: ${{ secrets.DORMKIT_KEY_PASSWORD }}
        run: ./gradlew clean assembleRelease lintRelease --stacktrace

      - name: Prepare release files
        shell: bash
        run: |
          VERSION_NAME="$(grep '^VERSION_NAME=' version.properties | cut -d= -f2 | tr -d '\r')"
          mkdir -p release
          cp app/build/outputs/apk/release/app-release.apk "release/DormKit-${VERSION_NAME}.apk"
          cd release
          sha256sum "DormKit-${VERSION_NAME}.apk" > "DormKit-${VERSION_NAME}.apk.sha256"

      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION_NAME="$(grep '^VERSION_NAME=' version.properties | cut -d= -f2 | tr -d '\r')"
          APK="release/DormKit-${VERSION_NAME}.apk"
          SHA="release/DormKit-${VERSION_NAME}.apk.sha256"
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" "${APK}" "${SHA}" --clobber
          else
            gh release create "${GITHUB_REF_NAME}" "${APK}" "${SHA}" \
              --verify-tag \
              --title "DormKit ${VERSION_NAME}" \
              --generate-notes
          fi
